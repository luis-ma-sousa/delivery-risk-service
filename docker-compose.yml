services:
  db:
    image: postgres:17
    container_name: delivery-risk-db
    environment:
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: delivery
      POSTGRES_DB: delivery_risk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery -d delivery_risk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
